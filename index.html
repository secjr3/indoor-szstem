<!DOCTYPE html>
<html lang="en">

<head>

    <title>Tela | indoor szstem</title>

    <link rel="stylesheet" href="assets/style/wide/waiterScreen.css">

<body>



    <header class="screen-header">

    <main class="screen-area">

            <div>
                <strong>tv - 01</strong>

            </div>
        </div>

        <div class="screen-conection-title">
            CONECTE-SE A TELA
        </div>
        <div class="screen-conection-id">
            <div class="digitId"></div>
            <div class="digitId"></div>
            <div class="digitId"></div>
            <div class="cArrow"></div>
            <div class="digitId"></div>
            <div class="digitId"></div>
            <div class="digitId"></div>
        </div>

        <!-- Futuramente:
             files / playlist / autoplay / preview
        -->
        <div class="screen-content">
            <div class="ps5-glow"></div> <!-- Mantém o brilho suave de fundo -->

            <!-- Ondas Estilo PS3 -->

            <!-- As suas partículas antigas podem continuar aqui em baixo se quiser misturar os efeitos -->

            <div class="particula p2"></div>
            <div class="particula p3"></div>
        </div>
        


    </main>
    <div class="other-animation"></div>




    <script type="module" src="src/scripts/displays/display.js"></script>
